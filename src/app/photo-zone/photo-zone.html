<div
  class="photo-zone"
  [id]="node.id"
  cdkDropList
  [cdkDropListAutoScrollDisabled]="true"
  [cdkDropListSortingDisabled]="true"
  (pointerdown)="startPan($event)"
  (wheel)="zoom($event)"
  (cdkDropListDropped)="drop($event)"
  [cdkDropListConnectedTo]="['libraryList']"
>
  @if (node.image && assets.urlFor(node.image.src)) {
    <img
      [alt]="node.image.name || ('Collage photo' | t)"
      [src]="assets.urlFor(node.image.src)"
      (load)="onImageLoad($event)"
      [style.transform]="getTransform()"
      draggable="false"
    />
    @if (selected) {
      <button
        class="rotation-handle"
        type="button"
        [attr.aria-label]="'Rotate photo' | t"
        [attr.title]="'Drag to rotate · Arrow keys 1° · Shift 0.1°' | t"
        (pointerdown)="startRotation($event)"
        (keydown)="rotateKey($event)"
        (click)="$event.stopPropagation()"
      >
        ↻
      </button>
    }
  } @else {
    <div class="placeholder">
      {{
        node.image
          ? ('Add the original photo to reconnect:' | t) + ' ' + (node.image.name || ('Photo' | t))
          : ('Drop image here' | t)
      }}
    </div>
  }
</div>
